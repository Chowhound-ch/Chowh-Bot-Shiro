shiro:
  ws:
    client:
      enable: true
      url: ${SHIRO_WS_CLIENT_URL}
    access-token: ${SHIRO_TOKEN}
per:
  file-location: ${BOT_FILE_LOCATION}
  video-location: ${BOT_VIDEO_LOCATION}
  config-path: ${BOT_CONFIG_PATH}
  python:
    path: ${BOT_PYTHON_PATH}
  jm:
    img-path: ${BOT_JM_IMG_PATH}
  bot:
    owner: 825352674
  listener:
    impl: Shiro
    package: per.chowh
  network:
    proxy:
      host: ${BOT_PROXY_HOST}
      port: ${BOT_PROXY_PORT}
  dotenv:
    enabled: true
    profile: ${spring.profiles.active}
#    files: .env.${spring.profiles.active}

server:
  port: 8002

spring:
  profiles:
    active: dev
  datasource:
#    url: jdbc:mysql://${SERVER_IP}:3306/chowh_bot?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    url: jdbc:sqlite:${BOT_DB_FILE:bot.db}
#    username: ${MYSQL_USERNAME}
#    password: ${MYSQL_PASSWORD}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      # 初始化脚本在 DataSource 就绪后、依赖 SqlSessionFactory 的 Bean 之前执行
      # 脚本自身是 create table if not exists，重复执行无副作用
      mode: always
      encoding: UTF-8
      schema-locations: file:./config/db/*.sql
    hikari:
      maximum-pool-size: 10
      idle-timeout: 600000    # 10分钟
      max-lifetime: 1200000   # 20分钟，显著大于idle-timeout
      connection-timeout: 10000
      validation-timeout: 3000
      login-timeout: 5
      minimum-idle: 5
      read-only: false
  cache:
    jcache:
      config: classpath:ehcache.xml
    type: jcache
  freemarker:
    # 启用 freemarker 模板
    enabled: true
    suffix: .ftl
    template-loader-path:
      - classpath:/templates/
  mvc:
    static-path-pattern: /static/**
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_delete
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
